<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dapur Talent POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --brand:#4f46e5; }
  *{ font-family:'Inter',system-ui,sans-serif; }
  body{ background:#f4f7fe; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:#c7d2fe; border-radius:9999px; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes slideUp{ from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:translateY(0)} }
  @keyframes slideInRight{ from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes popIn{ from{opacity:0; transform:scale(.94)} to{opacity:1; transform:scale(1)} }
  .fadeIn{ animation:fadeIn .25s ease both }
  .slideUp{ animation:slideUp .3s cubic-bezier(.22,1,.36,1) both }
  .slideInRight{ animation:slideInRight .28s cubic-bezier(.22,1,.36,1) both }
  .popIn{ animation:popIn .22s cubic-bezier(.22,1,.36,1) both }
  .card{ background:#fff; border-radius:1.5rem; box-shadow:0 8px 30px -12px rgba(79,70,229,.18); }
  .soft{ box-shadow:0 6px 24px -14px rgba(30,41,59,.35); }
  .hide{ display:none !important; }
  @media print{
    body *{ visibility:hidden }
    #receiptPaper, #receiptPaper *{ visibility:visible }
    #receiptPaper{ position:fixed; inset:0; margin:0; width:100%; box-shadow:none }
  }
</style>
</head>
<body class="text-slate-800">

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-indigo-50 via-[#f4f7fe] to-indigo-100">
  <div class="w-full max-w-md card p-8 slideUp">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-300">
        <i class="fa-solid fa-utensils text-white text-2xl"></i>
      </div>
      <h1 class="mt-4 text-2xl font-extrabold tracking-tight">Dapur Talent POS</h1>
      <p class="text-sm text-slate-500 mt-1">Masuk untuk memulai shift Anda</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-600">Username</label>
        <div class="mt-1 relative">
          <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="loginUser" autocomplete="username" required placeholder="admin / kasir" class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-sm" />
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600">Password</label>
        <div class="mt-1 relative">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="loginPass" type="password" autocomplete="current-password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-sm" />
        </div>
      </div>
      <p id="loginError" class="hide text-xs text-rose-600 bg-rose-50 rounded-xl px-3 py-2"></p>
      <button id="loginBtn" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition shadow-lg shadow-indigo-200">Masuk</button>
    </form>
    <!-- Diperbarui untuk menampilkan informasi password -->
    <p class="text-[11px] text-center text-slate-500 mt-6 leading-relaxed bg-indigo-50/50 p-3 rounded-xl">
      Username: <b>admin<br/>
      Username: <b>kasir</b> (pass: talent)
    </p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide min-h-screen lg:flex">

  <!-- Sidebar desktop -->
  <aside id="sidebar" class="hidden lg:flex fixed lg:static inset-y-0 right-0 z-50 w-72 bg-indigo-700 text-white flex-col">
    <div class="p-6 border-b border-white/10 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-11 h-11 shrink-0 rounded-2xl bg-white/15 flex items-center justify-center"><i class="fa-solid fa-utensils"></i></div>
        <div class="min-w-0">
          <p id="sideStore" class="font-bold truncate">Dapur Talent</p>
          <p id="sideRole" class="text-[11px] text-indigo-200 uppercase tracking-wider">-</p>
        </div>
      </div>
      <button id="hideSide" title="Sembunyikan menu" class="w-9 h-9 shrink-0 rounded-xl bg-white/10 hover:bg-white/20 transition"><i class="fa-solid fa-angles-left text-xs"></i></button>
    </div>
    <nav id="navMenu" class="flex-1 overflow-y-auto p-4 space-y-1 no-scrollbar"></nav>
    <div class="p-4 border-t border-white/10">
      <button data-logout class="w-full py-3 rounded-2xl bg-white/10 hover:bg-white/20 transition text-sm font-semibold"><i class="fa-solid fa-right-from-bracket mr-2"></i>Keluar</button>
    </div>
  </aside>
  <button id="showSide" title="Tampilkan menu" class="hide hidden lg:grid place-items-center fixed top-4 left-4 z-40 w-11 h-11 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-300"><i class="fa-solid fa-bars"></i></button>

  <!-- Mobile overlay -->
  <div id="mobileNav" class="hide fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-slate-900/50 fadeIn" data-closenav></div>
    <div class="absolute inset-y-0 right-0 w-72 bg-indigo-700 text-white flex flex-col slideInRight">
      <div class="p-6 border-b border-white/10 flex items-center justify-between">
        <div class="min-w-0">
          <p id="sideStoreM" class="font-bold truncate">Dapur Talent</p>
          <p id="sideRoleM" class="text-[11px] text-indigo-200 uppercase tracking-wider">-</p>
        </div>
        <button data-closenav class="w-9 h-9 shrink-0 rounded-xl bg-white/10"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav id="navMenuM" class="flex-1 overflow-y-auto p-4 space-y-1 no-scrollbar"></nav>
      <div class="p-4 border-t border-white/10">
        <button data-logout class="w-full py-3 rounded-2xl bg-white/10 text-sm font-semibold"><i class="fa-solid fa-right-from-bracket mr-2"></i>Keluar</button>
      </div>
    </div>
  </div>

  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Mobile topbar -->
    <header class="lg:hidden sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-100 px-4 py-3 grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3">
      <div class="flex min-w-0 items-center gap-3">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-indigo-600 grid place-items-center text-white"><i class="fa-solid fa-utensils text-sm"></i></div>
        <p id="topTitle" class="truncate font-bold">Dashboard</p>
      </div>
      <button id="openNav" class="w-10 h-10 rounded-xl bg-slate-100 grid place-items-center"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main id="views" class="flex-1 min-w-0"></main>
  </div>
</div>

<!-- Modals root -->
<div id="modalRoot"></div>
<div id="toastRoot" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] space-y-2"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------------- Firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDJdYGj92ILaAaK4FZWf884GTilAraA_Ew",
  authDomain: "pos-talent.firebaseapp.com",
  projectId: "pos-talent",
  storageBucket: "pos-talent.firebasestorage.app",
  messagingSenderId: "289664113047",
  appId: "1:289664113047:web:fe7cde0ae3fe640cea0cd2",
  measurementId: "G-KR0ZCMGBB9"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ---------------- Helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const rp = n => "Rp " + (Number(n)||0).toLocaleString("id-ID");
const todayStr = (d=new Date()) => {
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
};
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2,10);

function toast(msg, type="ok"){
  const el = document.createElement("div");
  el.className = `px-4 py-3 rounded-2xl text-sm font-medium text-white slideUp soft ${type==="err"?"bg-rose-600":"bg-slate-900"}`;
  el.textContent = msg;
  $("#toastRoot").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 2200);
}

/* ---------------- State ---------------- */
const DEFAULT_SETTINGS = {
  storeName: "Dapur Talent",
  address: "Jl. Talenta No. 1, Jakarta",
  footer: "Terima kasih atas kunjungan Anda!"
};
const state = {
  role: null, user: null, view: "dashboard",
  categories: [], variants: [], products: [], transactions: [], expenses: [], expenseCats: [], shifts: [],
  cart: [], posCat: "all", posSearch: "",
  dashDate: todayStr(), shiftDate: todayStr(),
  sidebarHidden: localStorage.getItem("dt_sidehide") === "1",
  settings: { ...DEFAULT_SETTINGS, ...(JSON.parse(localStorage.getItem("dt_settings")||"{}")) },
  ready: false
};
const saveSettings = () => localStorage.setItem("dt_settings", JSON.stringify(state.settings));

const MENU = [
  { id:"dashboard",  label:"Dashboard",            icon:"fa-chart-pie",       admin:false },
  { id:"pos",        label:"POS / Kasir",          icon:"fa-cash-register",   admin:false },
  { id:"transactions",label:"Riwayat Transaksi",   icon:"fa-receipt",         admin:false },
  { id:"products",    label:"Produk",              icon:"fa-burger",          admin:true  },
  { id:"catalog",     label:"Kategori & Variasi",  icon:"fa-layer-group",     admin:true  },
  { id:"expenses",    label:"Pengeluaran",         icon:"fa-money-bill-wave", admin:false },
  { id:"shift",       label:"Shift Kasir",         icon:"fa-clock",           admin:false },
  { id:"settings",    label:"Pengaturan",          icon:"fa-gear",            admin:true  }
];
const PAYMENTS = [
  { id:"tunai",   label:"Tunai",   icon:"fa-money-bills" },
  { id:"bca",     label:"BCA",     icon:"fa-building-columns" },
  { id:"dana",    label:"DANA",    icon:"fa-wallet" },
  { id:"lainnya", label:"Lainnya", icon:"fa-ellipsis" }
];

/* ---------------- Auth ---------------- */
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const u = $("#loginUser").value.trim().toLowerCase();
  const p = $("#loginPass").value;
  const err = $("#loginError");
  err.classList.add("hide");
  
  // Pemetaan username ke email sesuai permintaan
  const map = { admin:"admin@dapurtalent.com", kasir:"kasir@dapurtalent.com" };
  const email = map[u] || (u.includes("@") ? u : `${u}@dapurtalent.com`);
  
  $("#loginBtn").disabled = true;
  $("#loginBtn").innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memproses...';
  try {
    await signInWithEmailAndPassword(auth, email, p);
  } catch(ex){
    err.textContent = "Login gagal: username atau password salah.";
    err.classList.remove("hide");
  } finally {
    $("#loginBtn").disabled = false;
    $("#loginBtn").textContent = "Masuk";
  }
});
document.addEventListener("click", e=>{
  if (e.target.closest("[data-logout]")) signOut(auth);
});

let unsubs = [];
onAuthStateChanged(auth, user=>{
  if (user){
    state.user = user;
    state.role = (user.email||"").startsWith("admin") ? "admin" : "kasir";
    state.view = state.role === "kasir" ? "pos" : "dashboard";
    $("#loginScreen").classList.add("hide");
    $("#app").classList.remove("hide");
    buildNav(); subscribeAll(); render();
  } else {
    unsubs.forEach(f=>f()); unsubs = [];
    state.user=null; state.role=null; state.cart=[]; state.ready=false;
    $("#app").classList.add("hide");
    $("#loginScreen").classList.remove("hide");
  }
});

/* ---------------- Firestore realtime ---------------- */
function sub(name, key){
  return onSnapshot(collection(db, name), snap=>{
    state[key] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=>console.warn(name, err.message));
}
function subscribeAll(){
  unsubs.forEach(f=>f());
  unsubs = [
    sub("categories","categories"), sub("variants","variants"), sub("products","products"),
    sub("transactions","transactions"), sub("expenses","expenses"), sub("expenseCategories","expenseCats"),
    sub("shifts","shifts")
  ];
  state.ready = true;
}

/* ---------------- Nav ---------------- */
function buildNav(){
  const html = MENU.filter(m=> !m.admin || state.role==="admin").map(m=>`
    <button data-nav="${m.id}" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium transition ${m.admin?"admin-only":""}">
      <i class="fa-solid ${m.icon} w-5 text-center"></i><span>${m.label}</span>
    </button>`).join("");
  $("#navMenu").innerHTML = html;
  $("#navMenuM").innerHTML = html;
  $("#sideStore").textContent = state.settings.storeName;
  $("#sideStoreM").textContent = state.settings.storeName;
  $("#sideRole").textContent = state.role === "admin" ? "Administrator" : "Kasir";
  $("#sideRoleM").textContent = state.role === "admin" ? "Administrator" : "Kasir";
  $("#sidebar").classList.toggle("hidden", false);
  $("#sidebar").classList.add("lg:flex");
  applySidebar();
}
function paintNav(){
  $$("[data-nav]").forEach(b=>{
    const on = b.dataset.nav === state.view;
    b.className = `nav-item w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium transition ${on?"bg-white text-indigo-700 shadow-lg":"text-indigo-100 hover:bg-white/10"}`;
  });
  $("#topTitle").textContent = (MENU.find(m=>m.id===state.view)||{}).label || "";
}
document.addEventListener("click", e=>{
  const n = e.target.closest("[data-nav]");
  if (n){ state.view = n.dataset.nav; $("#mobileNav").classList.add("hide"); render(); window.scrollTo(0,0); }
  if (e.target.closest("#openNav")) $("#mobileNav").classList.remove("hide");
  if (e.target.closest("[data-closenav]")) $("#mobileNav").classList.add("hide");
  if (e.target.closest("#hideSide")) setSidebar(true);
  if (e.target.closest("#showSide")) setSidebar(false);
});

/* --------- Sidebar show / hide (desktop) --------- */
function setSidebar(hidden){
  state.sidebarHidden = hidden;
  localStorage.setItem("dt_sidehide", hidden ? "1" : "0");
  applySidebar();
}
function applySidebar(){
  const side = $("#sidebar"), btn = $("#showSide");
  if (!side || !btn) return;
  side.classList.toggle("lg:flex", !state.sidebarHidden);
  side.classList.toggle("lg:hidden", state.sidebarHidden);
  btn.classList.toggle("hide", !state.sidebarHidden);
}

/* ---------------- Modal ---------------- */
function modal(html, { size="max-w-lg", sheet=false } = {}){
  const wrap = document.createElement("div");
  wrap.className = "fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4";
  wrap.innerHTML = `
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm fadeIn" data-close></div>
    <div class="relative w-full ${size} bg-white rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto ${sheet?"slideUp":"popIn"} no-scrollbar">${html}</div>`;
  $("#modalRoot").appendChild(wrap);
  wrap.addEventListener("click", ev=>{ if (ev.target.closest("[data-close]")) wrap.remove(); });
  return wrap;
}
const closeModals = () => $("#modalRoot").innerHTML = "";

/* ---------------- Data helpers ---------------- */
const catName = id => (state.categories.find(c=>c.id===id)||{}).name || "Tanpa Kategori";
const txDate = t => (t.date || "").slice(0,10);
const inDay = (d, day) => (d||"").slice(0,10) === day;
const openShift = () => state.shifts.find(s=>s.status==="open") || null; // Helper fungsi shift

function dayStats(day){
  const tx = state.transactions.filter(t=>inDay(t.date, day));
  const ex = state.expenses.filter(e=>inDay(e.date, day));
  const income = tx.reduce((s,t)=>s+(t.total||0),0);
  const spend = ex.reduce((s,e)=>s+(e.amount||0),0);
  const byPay = {};
  PAYMENTS.forEach(p=>byPay[p.id]=0);
  tx.forEach(t=>{ byPay[t.payment||"lainnya"] = (byPay[t.payment||"lainnya"]||0) + (t.total||0); });
  const cashOut = ex.filter(e=>(e.source||"tunai")==="tunai").reduce((s,e)=>s+(e.amount||0),0);
  return { tx, ex, income, spend, byPay, cashOut, profit: income-spend };
}
function topItems(day){
  const map = {};
  state.transactions.filter(t=>inDay(t.date, day)).forEach(t=>(t.items||[]).forEach(i=>{
    const k = i.name;
    map[k] = map[k] || { name:k, qty:0, total:0 };
    map[k].qty += i.qty; map[k].total += i.subtotal;
  }));
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,5);
}

/* ---------------- Render root ---------------- */
let charts = {};
function render(){
  if (!state.user) return;
  paintNav();
  const v = $("#views");
  const map = {
    dashboard: viewDashboard, pos: viewPOS, transactions: viewTransactions,
    products: viewProducts, catalog: viewCatalog, expenses: viewExpenses,
    shift: viewShift, settings: viewSettings
  };
  const fn = map[state.view] || viewDashboard;
  v.innerHTML = `<div class="fadeIn">${fn()}</div>`;
  if (state.view === "dashboard") drawCharts();
  
  // Perbarui UI Cart hanya jika shift terbuka (karena elemen tsb mungkin tidak ada jika shift ditutup)
  if (state.view === "pos" && openShift()) syncCartUI();
  
  if (state.view === "expenses") drawExpenseChart();
}

/* ---------------- Page header ---------------- */
const pageHead = (title, sub, right="") => `
  <div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-4 mb-6">
    <div class="min-w-0">
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight truncate">${title}</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-0.5">${sub}</p>
    </div>
    <div class="shrink-0 flex items-center gap-2">${right}</div>
  </div>`;

/* ================= DASHBOARD ================= */
function viewDashboard(){
  const day = state.dashDate;
  const s = dayStats(day);
  const isAdmin = state.role === "admin";
  const kpi = (label, val, icon, color) => `
    <div class="card p-5">
      <div class="flex items-center justify-between">
        <p class="text-xs font-semibold text-slate-500">${label}</p>
        <div class="w-9 h-9 rounded-xl grid place-items-center ${color}"><i class="fa-solid ${icon} text-sm"></i></div>
      </div>
      <p class="mt-3 text-xl sm:text-2xl font-extrabold tracking-tight">${val}</p>
    </div>`;

  const kasirPanel = `
    <div class="card p-6 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white grid place-items-center"><i class="fa-solid fa-box-open"></i></div>
        <div><p class="font-bold">Status Laci Kasir</p><p class="text-xs text-slate-500">Ringkasan uang fisik hari ini</p></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="rounded-2xl bg-emerald-50 p-4"><p class="text-[11px] font-semibold text-emerald-700">Pemasukan Tunai</p><p class="text-lg font-extrabold text-emerald-700 mt-1">${rp(s.byPay.tunai)}</p></div>
        <div class="rounded-2xl bg-rose-50 p-4"><p class="text-[11px] font-semibold text-rose-700">Pengeluaran Laci</p><p class="text-lg font-extrabold text-rose-700 mt-1">${rp(s.cashOut)}</p></div>
        <div class="rounded-2xl bg-indigo-50 p-4"><p class="text-[11px] font-semibold text-indigo-700">Estimasi Uang Fisik</p><p class="text-lg font-extrabold text-indigo-700 mt-1">${rp(s.byPay.tunai - s.cashOut)}</p></div>
      </div>
      <div class="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
        ${PAYMENTS.map(p=>`<div class="rounded-2xl border border-slate-100 p-3"><p class="text-[11px] text-slate-500"><i class="fa-solid ${p.icon} mr-1"></i>${p.label}</p><p class="font-bold text-sm mt-1">${rp(s.byPay[p.id])}</p></div>`).join("")}
      </div>
    </div>`;

  const adminPanel = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
      ${kpi("Pendapatan", rp(s.income), "fa-arrow-trend-up", "bg-emerald-100 text-emerald-600")}
      ${kpi("Pengeluaran", rp(s.spend), "fa-arrow-trend-down", "bg-rose-100 text-rose-600")}
      ${kpi("Laba Bersih", rp(s.profit), "fa-sack-dollar", "bg-indigo-100 text-indigo-600")}
      ${kpi("Transaksi", s.tx.length, "fa-receipt", "bg-amber-100 text-amber-600")}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mb-6">
      <div class="card p-5 xl:col-span-2">
        <p class="font-bold text-sm mb-1">Tren 7 Hari Terakhir</p>

function drawCharts(){
  const dd = $("#dashDate");
  if (dd) dd.onchange = e => { state.dashDate = e.target.value || todayStr(); render(); };
  Object.values(charts).forEach(c=>c&&c.destroy()); charts = {};
  if (state.role !== "admin") return;

  const base = new Date(state.dashDate + "T00:00:00");
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(base); d.setDate(d.getDate()-(6-i)); return todayStr(d); });
  const inc = days.map(d=>dayStats(d).income);
  const exp = days.map(d=>dayStats(d).spend);

  const c1 = $("#chartTrend");
  if (c1) charts.trend = new Chart(c1, {
    type:"line",
    data:{ labels: days.map(d=>d.slice(8)+"/"+d.slice(5,7)), datasets:[
      { label:"Pendapatan", data:inc, borderColor:"#4f46e5", backgroundColor:"rgba(79,70,229,.12)", fill:true, tension:.4, borderWidth:3, pointRadius:3 },
      { label:"Pengeluaran", data:exp, borderColor:"#f43f5e", backgroundColor:"rgba(244,63,94,.10)", fill:true, tension:.4, borderWidth:3, pointRadius:3 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, usePointStyle:true } } },
      scales:{ y:{ ticks:{ callback:v=>"Rp"+(v/1000)+"k" }, grid:{ color:"#eef2ff" } }, x:{ grid:{ display:false } } } }
  });

  const s = dayStats(state.dashDate);
  const c2 = $("#chartPay");
  if (c2) charts.pay = new Chart(c2, {
    type:"doughnut",
    data:{ labels: PAYMENTS.map(p=>p.label), datasets:[{ data: PAYMENTS.map(p=>s.byPay[p.id]),
      backgroundColor:["#4f46e5","#0ea5e9","#22c55e","#f59e0b"], borderWidth:0, hoverOffset:8 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"65%",
      plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, usePointStyle:true } } } }
  });
}

  const w = modal(`

      <h3 class="text-lg font-extrabold mt-0.5">${esc(p.name)}</h3>
      <p class="text-sm text-slate-500">Harga dasar <b class="text-indigo-600">${rp(p.price)}</b></p>

            </div>

                <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-200 cursor-pointer hover:border-indigo-400 transition">
                  <input type="${g.type}" name="vg_${g.id}" class="vopt accent-indigo-600 w-4 h-4"
                    data-group="${esc(g.name)}" data-label="${esc(o.name)}" data-price="${Number(o.price)||0}" ${g.type==="radio"&&ix===0?"checked":""} />
                  <span class="flex-1 text-sm">${esc(o.name)}</span>
                  <span class="text-xs font-semibold ${Number(o.price)?"text-indigo-600":"text-slate-400"}">${Number(o.price)?"+"+rp(o.price):"Gratis"}</span>
                </label>`).join("")}
            </div>
          </div>`).join("")}
      </div>
    </div>
    <div class="sticky bottom-0 bg-white border-t border-slate-100 p-4 flex items-center gap-3">
      <div class="flex items-center gap-2 shrink-0">
        <button id="vMinus" class="w-10 h-10 rounded-2xl bg-slate-100 font-bold">−</button>
        <span id="vQty" class="w-8 text-center font-extrabold">1</span>
        <button id="vPlus" class="w-10 h-10 rounded-2xl bg-slate-100 font-bold">+</button>
      </div>
      <button id="vAdd" class="flex-1 py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-sm">Tambah • <span id="vTotal">${rp(p.price)}</span></button>
    </div>`, { size:"max-w-md", sheet:true });

  let qty = 1;
  const calc = ()=>{
    const opts = $$(".vopt", w).filter(i=>i.checked).map(i=>({ group:i.dataset.group, label:i.dataset.label, price:Number(i.dataset.price)||0 }));
    const unit = Number(p.price) + opts.reduce((s,o)=>s+o.price,0);
    $("#vTotal", w).textContent = rp(unit*qty);
    return { opts, unit };
  };
  w.addEventListener("change", e=>{ if (e.target.classList.contains("vopt")) calc(); });
  $("#vMinus", w).onclick = ()=>{ qty=Math.max(1,qty-1); $("#vQty",w).textContent=qty; calc(); };
  $("#vPlus", w).onclick = ()=>{ qty++; $("#vQty",w).textContent=qty; calc(); };
  $("#vAdd", w).onclick = ()=>{ const { opts } = calc(); addToCart(p, opts, qty); w.remove(); };
  calc();
}
function addToCart(p, options, qty){
  const unitPrice = Number(p.price) + options.reduce((s,o)=>s+o.price,0);
  const key = p.id + "|" + options.map(o=>o.label).sort().join("~");
  const ex = state.cart.find(i=>i.key===key);
  if (ex){ ex.qty += qty; ex.subtotal = ex.qty*ex.unitPrice; }
  else state.cart.push({ key, productId:p.id, name:p.name, options, unitPrice, qty, subtotal: unitPrice*qty });
  syncCartUI(); toast(`${p.name} ditambahkan`);
}

document.addEventListener("click", e=>{
  const pc = e.target.closest("[data-poscat]");
  if (pc){ state.posCat = pc.dataset.poscat; render(); return; }
  const pr = e.target.closest("[data-prod]");
  if (pr){ const p = state.products.find(x=>x.id===pr.dataset.prod); if (p) openProduct(p); return; }
  if (e.target.closest("[data-cartclear]")){ state.cart=[]; syncCartUI(); return; }
  const del = e.target.closest("[data-cartdel]");
  if (del){ state.cart = state.cart.filter(i=>i.key!==del.dataset.cartdel); syncCartUI(); return; }
  const q = e.target.closest("[data-cartqty]");
  if (q){
    const it = state.cart.find(i=>i.key===q.dataset.cartqty);
    if (it){ it.qty += Number(q.dataset.d); if (it.qty<=0) state.cart = state.cart.filter(i=>i!==it); else it.subtotal = it.qty*it.unitPrice; }
    syncCartUI(); return;
  }
  if (e.target.closest("#cartFab")){ openCartSheet(); return; }
  if (e.target.closest("[data-checkout]")){ closeModals(); openCheckout(); return; }
});
document.addEventListener("input", e=>{
  if (e.target.id === "posSearch"){
    state.posSearch = e.target.value;
    const scroll = window.scrollY; render();
    const el = $("#posSearch"); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    window.scrollTo(0, scroll);
  }
});
function openCartSheet(){

function openCheckout(){
  const sub = state.cart.reduce((s,i)=>s+i.subtotal,0);
  const w = modal(`
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <div><p class="font-extrabold text-lg">Pembayaran</p><p class="text-xs text-slate-500">${state.cart.length} item di keranjang</p></div>

    </div>

      <div class="rounded-2xl bg-slate-50 p-4 space-y-2 text-sm">
        <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><b>${rp(sub)}</b></div>
        <div class="flex justify-between items-center gap-3">
          <span class="text-slate-500 shrink-0">Diskon</span>
          <input id="coDisc" type="number" min="0" value="0" class="w-36 text-right px-3 py-2 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 text-sm" />
        </div>
        <div class="flex justify-between border-t border-slate-200 pt-2"><span class="font-semibold">Grand Total</span><b id="coTotal" class="text-lg text-indigo-600 font-extrabold">${rp(sub)}</b></div>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-600 mb-2">Metode Pembayaran</p>
        <div class="grid grid-cols-2 gap-2">
          ${PAYMENTS.map((p,i)=>`
            <label class="pay-box flex items-center gap-3 p-3 rounded-2xl border-2 cursor-pointer transition ${i===0?"border-indigo-600 bg-indigo-50":"border-slate-200"}">
              <input type="radio" name="pay" value="${p.id}" class="hidden" ${i===0?"checked":""} />
              <span class="w-9 h-9 rounded-xl bg-white grid place-items-center text-indigo-600 shadow-sm"><i class="fa-solid ${p.icon} text-sm"></i></span>
              <span class="text-sm font-semibold">${p.label}</span>
            </label>`).join("")}
        </div>
      </div>
      <div id="cashBox">
        <p class="text-xs font-bold text-slate-600 mb-2">Uang Diterima</p>
        <input id="coCash" type="number" min="0" placeholder="0" class="w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 text-lg font-bold" />
        <div id="quickCash" class="grid grid-cols-3 gap-2 mt-2"></div>
        <div class="flex justify-between mt-3 rounded-2xl bg-emerald-50 px-4 py-3">
          <span class="text-sm font-semibold text-emerald-700">Kembalian</span>
          <b id="coChange" class="text-emerald-700 font-extrabold">Rp 0</b>
        </div>
      </div>
    </div>
    <div class="sticky bottom-0 bg-white border-t border-slate-100 p-4">
      <button id="coPay" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-sm shadow-lg shadow-indigo-200">Proses & Cetak Struk</button>
    </div>`, { size:"max-w-md", sheet:true });

  const total = () => Math.max(0, sub - (Number($("#coDisc",w).value)||0));
  const payMethod = () => ($$('input[name="pay"]',w).find(r=>r.checked)||{}).value || "tunai";
  const roundUp = (n, step) => Math.ceil(n/step)*step;

  function refresh(){
    const t = total();
    $("#coTotal",w).textContent = rp(t);
    const cash = payMethod()==="tunai";
    $("#cashBox",w).classList.toggle("hide", !cash);
    const opts = [...new Set([t, roundUp(t,50000), roundUp(t,100000)])];
    $("#quickCash",w).innerHTML = opts.map(v=>`<button type="button" data-qc="${v}" class="py-2 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold">${rp(v)}</button>`).join("");
    const recv = Number($("#coCash",w).value)||0;
    $("#coChange",w).textContent = rp(Math.max(0, recv - t));
  }
  w.addEventListener("input", refresh);
  w.addEventListener("change", ()=>{
    $$(".pay-box",w).forEach(b=>{
      const on = b.querySelector("input").checked;
      b.className = `pay-box flex items-center gap-3 p-3 rounded-2xl border-2 cursor-pointer transition ${on?"border-indigo-600 bg-indigo-50":"border-slate-200"}`;
    });
    refresh();
  });
  w.addEventListener("click", e=>{
    const qc = e.target.closest("[data-qc]");
    if (qc){ $("#coCash",w).value = qc.dataset.qc; refresh(); }
  });
  refresh();

  $("#coPay",w).onclick = async ()=>{
    if (!openShift()) return toast("Kasir belum dibuka. Buka shift terlebih dulu di menu Shift Kasir.","err");
    const t = total(); const method = payMethod();
    const recv = method==="tunai" ? (Number($("#coCash",w).value)||0) : t;
    if (method==="tunai" && recv < t) return toast("Uang diterima kurang dari total", "err");
    const btn = $("#coPay",w); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const trx = {
      invoice: "INV-" + Date.now().toString().slice(-8),
      date: new Date().toISOString(),
      items: state.cart.map(i=>({ name:i.name, qty:i.qty, unitPrice:i.unitPrice, subtotal:i.subtotal, options:i.options })),
      subtotal: sub, discount: Number($("#coDisc",w).value)||0, total: t,
      payment: method, received: recv, change: Math.max(0, recv-t),
      cashier: state.user.email, createdAt: serverTimestamp()
    };
    try {
      await addDoc(collection(db,"transactions"), trx);
      for (const it of state.cart){
        const p = state.products.find(x=>x.id===it.productId);
        if (p && p.stock !== null && p.stock !== undefined && p.stock !== "")
          await updateDoc(doc(db,"products",p.id), { stock: Math.max(0, Number(p.stock) - it.qty) });
      }
      state.cart = []; w.remove(); closeModals(); syncCartUI(); render();
      showReceipt(trx);
    } catch(ex){ toast("Gagal menyimpan transaksi", "err"); btn.disabled=false; btn.textContent="Proses & Cetak Struk"; }
  };
}

/* --------- Verifikasi username & password --------- */
const emailOf = u => {
  const map = { admin:"admin@dapurtalent.com", kasir:"kasir@dapurtalent.com" };
  const k = (u||"").trim().toLowerCase();
  return map[k] || (k.includes("@") ? k : `${k}@dapurtalent.com`);
};
async function verifyCredentials(username, password, requireAdmin=false){
  const email = emailOf(username);
  if (email !== (state.user.email||"").toLowerCase())
    throw new Error("Username tidak cocok dengan akun yang sedang aktif.");
  if (requireAdmin && state.role !== "admin")
    throw new Error("Aksi ini hanya untuk administrator.");
  await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(email, password));
}
function askCredentials({ title, desc="", confirmLabel="Verifikasi", danger=false, requireAdmin=false, onOk }){
  const w = modal(`
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <p class="font-extrabold text-lg">${esc(title)}</p>
      <button data-close class="w-9 h-9 rounded-xl bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-4">
      ${desc?`<p class="text-sm text-slate-500 leading-relaxed">${desc}</p>`:""}
      <div><p class="text-xs font-bold text-slate-600 mb-1">Username</p>
        <input id="vcUser" value="${esc((state.user.email||"").split("@")[0])}" class="w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 text-sm" /></div>
      <div><p class="text-xs font-bold text-slate-600 mb-1">Password</p>
        <input id="vcPass" type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 text-sm" /></div>
      <p id="vcErr" class="hide text-xs text-rose-600 bg-rose-50 rounded-xl px-3 py-2"></p>
    </div>
    <div class="sticky bottom-0 bg-white border-t border-slate-100 p-4 flex gap-2">
      <button data-close class="flex-1 py-3 rounded-2xl bg-slate-100 font-semibold text-sm">Batal</button>
      <button id="vcOk" class="flex-1 py-3 rounded-2xl ${danger?"bg-rose-600":"bg-indigo-600"} text-white font-semibold text-sm">${esc(confirmLabel)}</button>
    </div>`, { size:"max-w-sm" });
  const err = $("#vcErr",w);
  $("#vcOk",w).onclick = async ()=>{
    const btn = $("#vcOk",w);
    err.classList.add("hide");
    btn.disabled = true; const old = btn.textContent;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      await verifyCredentials($("#vcUser",w).value, $("#vcPass",w).value, requireAdmin);
      await onOk();
      w.remove();
    } catch(ex){
      err.textContent = ex.code ? "Password salah atau verifikasi gagal." : ex.message;
      err.classList.remove("hide");
      btn.disabled = false; btn.textContent = old;
    }
  };
  setTimeout(()=>$("#vcPass",w).focus(), 80);
  return w;
}

/* ================= SHIFT KASIR ================= */
const DAY_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const fmtDay = d => { const x = new Date(d+"T00:00:00"); return `${DAY_ID[x.getDay()]}, ${x.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"})}`; };
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}) : "-";

function shiftRecap(day, from, to){
  const inRange = iso => {
    if (!iso) return false;
    const t = new Date(iso).getTime();
    if (from && t < new Date(from).getTime()) return false;
    if (to && t > new Date(to).getTime()) return false;
    return true;
  };
  const tx = state.transactions.filter(t => from ? inRange(t.date) : inDay(t.date, day));
  const ex = state.expenses.filter(e => inDay(e.date, day));
  const byPay = {}; PAYMENTS.forEach(p=>byPay[p.id]=0);
  tx.forEach(t=>{ byPay[t.payment||"lainnya"] = (byPay[t.payment||"lainnya"]||0) + (t.total||0); });
  const items = {};
  tx.forEach(t=>(t.items||[]).forEach(i=>{
    items[i.name] = items[i.name] || { name:i.name, qty:0, total:0 };
    items[i.name].qty += i.qty; items[i.name].total += i.subtotal;
  }));
  const byExpCat = {};
  ex.forEach(e=>{ const k=(e.category||"").trim()||"Tanpa Kategori"; byExpCat[k]=(byExpCat[k]||0)+(Number(e.amount)||0); });
  const income = tx.reduce((s,t)=>s+(t.total||0),0);
  const spend = ex.reduce((s,e)=>s+(Number(e.amount)||0),0);
  return {
    day, income, spend, profit: income-spend, trxCount: tx.length, byPay,
    items: Object.values(items).sort((a,b)=>b.qty-a.qty),
    expenses: ex.map(e=>({ description:e.description, category:e.category||"Tanpa Kategori", amount:Number(e.amount)||0, source:e.source||"tunai" })),
    byExpCat
  };
}

        });
        toast("Kasir dibuka. Selamat bertugas!");
      }
    });
  }
  if (e.target.closest("[data-closeshift]")){
    const cur = openShift();
    if (!cur) return toast("Tidak ada shift yang terbuka","err");
    return void askCredentials({
      title: "Tutup Kasir",
      desc: `Verifikasi untuk menutup kasir <b>${fmtDay(cur.date)}</b> dan mengunci rekap penjualan hari ini.`,
      confirmLabel: "Tutup & Lihat Rekap",
      danger: true,
      onOk: async ()=>{
        const closeAt = new Date().toISOString();
        const r = shiftRecap(cur.date, cur.openAt, closeAt);
        await updateDoc(doc(db,"shifts",cur.id), {
          status: "closed", closeAt, closeBy: state.user.email, summary: r
        });
        toast("Kasir ditutup");
        showRecapModal("Rekap Penutupan Kasir", `${fmtDay(cur.date)} • ${fmtTime(cur.openAt)} - ${fmtTime(closeAt)}`, r);
      }
    });
  }
  const sr = e.target.closest("[data-shiftrecap]");
  if (sr){
    const s = state.shifts.find(x=>x.id===sr.dataset.shiftrecap);
    if (s) showRecapModal("Rekap Shift", `${fmtDay(s.date)} • ${fmtTime(s.openAt)} - ${fmtTime(s.closeAt)}`,
      s.summary || shiftRecap(s.date, s.openAt, s.closeAt));
  }
});

        ${state.expenseCats.length ? `<div class="space-y-2">${state.expenseCats.map(c=>`

document.addEventListener("click", async e=>{
  if (e.target.closest("#sSave")){
    state.settings = { storeName: $("#sName").value.trim()||"Dapur Talent", address: $("#sAddr").value.trim(), footer: $("#sFoot").value.trim() };
    saveSettings(); buildNav(); paintNav(); toast("Pengaturan disimpan"); return;
  }
  if (e.target.closest("#ecAdd")){
    const w = modal(`<div class="p-5"><p class="font-extrabold text-lg mb-4">Kategori Pengeluaran</p>
      <input id="ecName" placeholder="Nama kategori" class="w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 text-sm" />
      <div class="flex gap-2 mt-4"><button data-close class="flex-1 py-3 rounded-2xl bg-slate-100 font-semibold text-sm">Batal</button>
      <button id="ecSave" class="flex-1 py-3 rounded-2xl bg-indigo-600 text-white font-semibold text-sm">Simpan</button></div></div>`, { size:"max-w-sm" });
    $("#ecSave",w).onclick = async ()=>{
      const n = $("#ecName",w).value.trim(); if (!n) return toast("Nama wajib diisi","err");
      await addDoc(collection(db,"expenseCategories"), { name:n }); w.remove(); toast("Kategori ditambahkan");
    };
    return;
  }
  const de = e.target.closest("[data-delec]");
  if (de && confirm("Hapus kategori ini?")) return void deleteDoc(doc(db,"expenseCategories",de.dataset.delec));
});
</script>
